<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Shine R Mathew — Student, Creator and Developer."
  >

  <meta name="theme-color" content="#050505">

  <title>Shine R Mathew | Creator • Developer</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #050505;
      color: #fff;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: #00e5ff;
      color: #000;
    }

    /* =========================================================
       GLOBAL BACKGROUND
    ========================================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -3;

      background:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 70px 70px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
      );
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%);

      background: rgba(0,229,255,0.06);
      filter: blur(120px);
      border-radius: 50%;

      pointer-events: none;
      z-index: -4;
    }

    /* =========================================================
       SCROLLBAR
    ========================================================= */

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #00e5ff;
      border-radius: 10px;
    }

    /* =========================================================
       NAVBAR
    ========================================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      background: rgba(5,5,5,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      z-index: 1000;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #00e5ff;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .desktop-nav a {
      position: relative;
      color: #aaa;
      font-size: 14px;
      transition: 0.3s ease;
    }

    .desktop-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;

      width: 0;
      height: 2px;

      background: #00e5ff;
      transition: 0.3s ease;
    }

    .desktop-nav a:hover {
      color: #fff;
    }

    .desktop-nav a:hover::after {
      width: 100%;
    }

    .menu-button {
      display: none;

      width: 52px;
      height: 52px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 15px;

      background: rgba(255,255,255,0.06);
      color: white;

      cursor: pointer;

      align-items: center;
      justify-content: center;

      flex-direction: column;
      gap: 6px;
    }

    .menu-button span {
      width: 23px;
      height: 2px;
      background: white;
      transition: 0.3s ease;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .mobile-menu {
      position: fixed;
      inset: 76px 0 0;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(0,229,255,0.12),
          transparent 35%
        ),
        rgba(5,5,5,0.97);

      backdrop-filter: blur(25px);

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;

      transition: 0.35s ease;

      z-index: 999;
    }

    .mobile-menu.active {
      opacity: 1;
      visibility: visible;
    }

    .mobile-menu ul {
      list-style: none;
      text-align: center;
    }

    .mobile-menu li {
      margin: 24px 0;
      transform: translateY(20px);
      opacity: 0;

      transition: 0.35s ease;
    }

    .mobile-menu.active li {
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-menu a {
      font-size: 32px;
      font-weight: 800;
    }

    .mobile-menu a:hover {
      color: #00e5ff;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        150px
        20px
        80px;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(0,229,255,0.12),
          transparent 35%
        );
    }

    .hero::before {
      content: "";
      position: absolute;

      width: 1px;
      height: 100%;

      left: 50%;
      top: 0;

      background: linear-gradient(
        transparent,
        rgba(0,229,255,0.18),
        transparent
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 1000px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 10px 20px;

      border: 1px solid rgba(0,229,255,0.3);
      border-radius: 50px;

      background: rgba(0,229,255,0.04);

      color: #00e5ff;

      font-weight: 700;
      font-size: 14px;

      margin-bottom: 30px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      background: #00e5ff;
      border-radius: 50%;

      box-shadow:
        0 0 10px #00e5ff;

      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .45;
        transform: scale(.7);
      }
    }

    .hero h1 {
      font-size: clamp(52px, 11vw, 120px);
      line-height: .92;
      letter-spacing: -5px;
      font-weight: 950;

      margin-bottom: 30px;
    }

    .hero h1 .cyan {
      color: #00e5ff;
      text-shadow:
        0 0 35px rgba(0,229,255,0.18);
    }

    .hero-description {
      max-width: 720px;
      margin: auto;

      color: #999;

      font-size: clamp(17px, 2vw, 21px);
    }

    .hero-description strong {
      color: white;
    }

    .hero-buttons {
      margin-top: 38px;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 190px;

      padding: 16px 25px;

      border-radius: 16px;

      font-weight: 800;

      transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
    }

    .btn-primary {
      background: #00e5ff;
      color: #000;

      box-shadow:
        0 0 30px rgba(0,229,255,0.18);
    }

    .btn-primary:hover {
      transform: translateY(-4px);

      box-shadow:
        0 15px 40px rgba(0,229,255,0.25);
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: white;
    }

    .btn-secondary:hover {
      transform: translateY(-4px);
      border-color: rgba(0,229,255,0.5);
      color: #00e5ff;
    }

    /* =========================================================
       HERO STATS
    ========================================================= */

    .hero-stats {
      margin-top: 80px;

      display: flex;
      justify-content: center;
      gap: 70px;
    }

    .stat strong {
      display: block;
      font-size: 34px;
      line-height: 1;
    }

    .stat span {
      display: block;

      margin-top: 9px;

      color: #666;

      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* =========================================================
       GENERAL SECTIONS
    ========================================================= */

    section {
      position: relative;
      padding: 130px 6%;
    }

    .section-dark {
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(0,229,255,0.05),
          transparent 35%
        );
    }

    .section-header {
      max-width: 800px;
      margin: 0 auto 70px;
      text-align: center;
    }

    .section-number {
      color: #00e5ff;

      font-size: 14px;
      font-weight: 900;

      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .section-header h2 {
      margin-top: 14px;

      font-size: clamp(40px, 7vw, 70px);
      line-height: 1;

      letter-spacing: -2px;
    }

    .section-header p {
      margin-top: 25px;

      color: #888;

      font-size: 18px;
    }

    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      max-width: 1100px;
      margin: auto;

      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 60px;

      align-items: center;
    }

    .identity-card {
      min-height: 430px;

      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;

      background:
        radial-gradient(
          circle,
          rgba(0,229,255,0.11),
          transparent 50%
        ),
        rgba(255,255,255,0.025);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;
    }

    .identity-card::before,
    .identity-card::after {
      content: "";
      position: absolute;

      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 50%;
    }

    .identity-card::before {
      width: 300px;
      height: 300px;
    }

    .identity-card::after {
      width: 390px;
      height: 390px;
    }

    .initials {
      width: 220px;
      height: 220px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050505;

      border: 2px solid #00e5ff;

      box-shadow:
        0 0 50px rgba(0,229,255,0.18);

      font-size: 55px;
      font-weight: 950;

      color: #00e5ff;

      position: relative;
      z-index: 2;
    }

    .identity-name {
      position: absolute;

      bottom: 28px;
      left: 8%;
      right: 8%;

      padding: 16px;

      text-align: center;

      background: rgba(0,0,0,.65);

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;

      color: #aaa;
    }

    .about-text h3 {
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.05;
    }

    .about-text h3 span {
      color: #00e5ff;
    }

    .about-text p {
      margin-top: 25px;

      color: #999;
      font-size: 18px;
    }

    /* =========================================================
       SKILLS
    ========================================================= */

    .skills-grid {
      max-width: 1150px;
      margin: auto;

      display: grid;
      grid-template-columns: repeat(2,1fr);

      gap: 20px;
    }

    .skill-card {
      padding: 40px;

      min-height: 250px;

      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.015)
        );

      transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    }

    .skill-card:hover {
      transform: translateY(-8px);

      border-color: rgba(0,229,255,.4);

      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
    }

    .skill-icon {
      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: rgba(0,229,255,.07);

      border: 1px solid rgba(0,229,255,.18);

      color: #00e5ff;

      font-size: 25px;

      margin-bottom: 28px;
    }

    .skill-card h3 {
      font-size: 24px;
    }

    .skill-card p {
      margin-top: 12px;
      color: #888;
    }

    /* =========================================================
       PROJECTS
    ========================================================= */

    .projects-grid {
      max-width: 1150px;
      margin: auto;

      display: grid;
      grid-template-columns: repeat(2,1fr);

      gap: 25px;
    }

    .project-card {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 30px;

      overflow: hidden;

      background: #0b0b0b;

      transition: .35s ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      border-color: rgba(0,229,255,.4);
    }

    .project-visual {
      height: 280px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(0,229,255,.17),
          transparent 55%
        ),
        #070707;

      border-bottom: 1px solid rgba(255,255,255,.08);

      position: relative;
      overflow: hidden;
    }

    .project-number {
      font-size: 105px;
      font-weight: 950;

      color: #00e5ff;

      text-shadow:
        0 0 45px rgba(0,229,255,.25);
    }

    .project-grid-lines {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          transparent 49.8%,
          rgba(0,229,255,.15) 50%,
          transparent 50.2%
        ),
        linear-gradient(
          transparent 49.8%,
          rgba(0,229,255,.15) 50%,
          transparent 50.2%
        );

      background-size: 80px 80px;

      opacity: .3;
    }

    .project-content {
      padding: 35px;
    }

    .project-category {
      color: #00e5ff;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 4px;
    }

    .project-content h3 {
      margin-top: 14px;

      font-size: 28px;
    }

    .project-content p {
      margin-top: 12px;
      color: #888;
    }

    .project-link {
      display: inline-block;

      margin-top: 25px;

      font-weight: 800;

      transition: .3s ease;
    }

    .project-link:hover {
      color: #00e5ff;
      transform: translateX(5px);
    }

    /* =========================================================
       JOURNEY
    ========================================================= */

    .timeline {
      max-width: 900px;
      margin: auto;

      position: relative;
    }

    .timeline::before {
      content: "";

      position: absolute;

      left: 18px;
      top: 0;
      bottom: 0;

      width: 2px;

      background:
        linear-gradient(
          #00e5ff,
          rgba(0,229,255,.05)
        );
    }

    .timeline-item {
      position: relative;

      padding-left: 70px;
      margin-bottom: 28px;
    }

    .timeline-dot {
      position: absolute;

      left: 6px;
      top: 35px;

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background: #050505;

      border: 2px solid #00e5ff;

      box-shadow:
        0 0 20px rgba(0,229,255,.35);
    }

    .timeline-card {
      padding: 35px;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 26px;

      background:
        rgba(255,255,255,.035);
    }

    .timeline-label {
      color: #00e5ff;

      font-size: 13px;
      font-weight: 900;

      letter-spacing: 3px;
    }

    .timeline-card h3 {
      margin-top: 12px;
      font-size: 27px;
    }

    .timeline-card p {
      margin-top: 12px;
      color: #888;
    }

    /* =========================================================
       CONTACT
    ========================================================= */

    .contact-box {
      max-width: 1000px;
      margin: auto;

      text-align: center;

      padding: 80px 30px;

      border: 1px solid rgba(0,229,255,.2);
      border-radius: 35px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(0,229,255,.11),
          transparent 50%
        ),
        rgba(255,255,255,.025);
    }

    .contact-box h2 {
      font-size: clamp(42px, 7vw, 70px);
      line-height: 1;
    }

    .contact-box h2 span {
      color: #00e5ff;
    }

    .contact-box p {
      max-width: 650px;
      margin: 25px auto;

      color: #888;
      font-size: 18px;
    }

    .email-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 17px 25px;

      border-radius: 17px;

      background: rgba(0,0,0,.4);

      border: 1px solid rgba(255,255,255,.1);

      transition: .3s ease;
    }

    .email-button:hover {
      border-color: #00e5ff;
      color: #00e5ff;
      transform: translateY(-4px);
    }

    .socials {
      margin-top: 25px;

      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social {
      width: 55px;
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.1);

      background: rgba(255,255,255,.04);

      font-weight: 900;

      transition: .3s ease;
    }

    .social:hover {
      color: #00e5ff;
      border-color: #00e5ff;

      transform: translateY(-5px);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 40px 20px;

      text-align: center;

      border-top: 1px solid rgba(255,255,255,.07);

      color: #666;

      font-size: 14px;
    }

    footer strong {
      color: #aaa;
    }

    /* =========================================================
       SCROLL REVEAL
    ========================================================= */

    .reveal {
      opacity: 0;
      transform: translateY(35px);

      transition:
        opacity .8s ease,
        transform .8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 850px) {

      .desktop-nav {
        display: none;
      }

      .menu-button {
        display: flex;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .skills-grid,
      .projects-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      section {
        padding: 100px 5%;
      }
    }

    @media (max-width: 600px) {

      .navbar {
        height: 68px;
        padding: 0 5%;
      }

      .mobile-menu {
        inset: 68px 0 0;
      }

      .logo {
        font-size: 22px;
      }

      .hero {
        padding:
          130px
          20px
          70px;
      }

      .hero h1 {
        font-size: clamp(48px, 15vw, 75px);
        letter-spacing: -3px;
      }

      .hero-description {
        font-size: 16px;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .hero-stats {
        gap: 25px;
        margin-top: 65px;
      }

      .stat strong {
        font-size: 26
