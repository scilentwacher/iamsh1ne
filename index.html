<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shine R Mathew — Personal Portfolio">
  <title>Shine R Mathew | Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 5, 5, 0.75);
      backdrop-filter: blur(15px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00e5ff;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: #ccc;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #00e5ff;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 20px 60px;
      background:
        radial-gradient(circle at 50% 30%, rgba(0,229,255,0.14), transparent 35%),
        #050505;
    }

    .hero-content {
      max-width: 900px;
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(0,229,255,0.4);
      border-radius: 30px;
      color: #00e5ff;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(45px, 9vw, 95px);
      line-height: 1;
      margin-bottom: 25px;
      font-weight: 900;
    }

    .hero h1 span {
      color: #00e5ff;
    }

    .hero p {
      color: #aaa;
      max-width: 650px;
      margin: auto;
      font-size: 18px;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

      padding: 13
